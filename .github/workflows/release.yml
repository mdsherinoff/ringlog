name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  build:
    strategy:
      matrix:
        include:
          - os: macos-latest
            asset: Ringlog-macOS.zip
          - os: windows-latest
            asset: Ringlog-Windows.zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ".[window]" pyinstaller pillow
      - name: Build Ringlog.app (macOS)
        if: runner.os == 'macOS'
        run: |
          pyinstaller --windowed --name Ringlog --icon packaging/icon.png --collect-data ringlog \
            --osx-bundle-identifier io.github.mdsherinoff.ringlog packaging/launcher.py
          ditto -c -k --keepParent dist/Ringlog.app ${{ matrix.asset }}
      - name: Build Ringlog.exe (Windows)
        if: runner.os == 'Windows'
        run: |
          pyinstaller --onefile --windowed --name Ringlog --icon packaging/icon.png --collect-data ringlog packaging/launcher.py
          Compress-Archive -Path dist/Ringlog.exe -DestinationPath ${{ matrix.asset }}
      - uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.asset }}
